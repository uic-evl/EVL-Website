name: Tailscale connectivity test

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Check connectivity
        run: |
          tailscale status
          tailscale ping --until-direct=false -c 3 www-new

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.WWW_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Create dated file on server
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519 evlroot@www-new \
            'echo "Created by GitHub Actions on $(date -u +%Y-%m-%dT%H:%M:%SZ)" > ~/ci-test.txt && cat ~/ci-test.txt'
