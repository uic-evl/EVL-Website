name: Monitor agent

on:
  pull_request:
    paths:
      - "_monitor/**"
      - "_data/monitor.yml"
      - ".github/workflows/monitor-*.yml"
  push:
    branches:
      - deployment
    paths:
      - "_monitor/**"
      - "_data/monitor.yml"
      - ".github/workflows/monitor-*.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _monitor/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  install:
    # the real install.sh on a real Linux host: pid and network namespaces, /hostfs,
    # the docker socket proxy and every published file (no GPU on GitHub runners)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install the agent
        run: sudo _monitor/agent/install.sh ci
      - name: Containers are hardened
        run: |
          docker inspect evl-monitor-agent --format '{{.Config.User}} {{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.PidMode}} {{.HostConfig.NetworkMode}}' | tee /tmp/agent
          grep -q '^10001:10001 true \[ALL\] host host$' /tmp/agent
          docker inspect evl-monitor-docker-proxy --format '{{.HostConfig.NetworkMode}}' | grep -qx none
          docker inspect evl-monitor-agent evl-monitor-docker-proxy --format '{{.HostConfig.RestartPolicy.Name}}' | sort -u | grep -qx always
          systemctl is-enabled docker
          ! docker exec evl-monitor-agent test -e /var/run/docker.sock
      - name: Services list this runner's containers
        run: |
          curl -fsS http://127.0.0.1:9877/services.json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          names = {c["name"] for c in d["containers"]}
          assert d["containers_status"] == "ok", d["containers_status"]
          assert {"evl-monitor-agent", "evl-monitor-docker-proxy"} <= names, names
          print(sorted(names))'
      - name: Install the hub with a test certificate and poll the agent
        run: |
          mkdir -p /tmp/hub/tls /tmp/hub/data
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout /tmp/hub/tls/key.pem -out /tmp/hub/tls/cert.pem 2>/dev/null
          # like arcade: the key belongs to a non-root account, mode 0600, in a private directory
          chmod 600 /tmp/hub/tls/key.pem && chmod 711 /tmp/hub/tls
          printf '%s\n' "groups:" "  - {id: g, name: CI, hosts: [ci, later]}" "hosts:" \
            "  ci: {name: CI, fqdn: 172.17.0.1, status: live}" \
            "  later: {name: Later, fqdn: later.evl.uic.edu, status: planned}" > /tmp/hub/data/monitor.yml
          sudo HUB_TLS_CERT=/tmp/hub/tls/cert.pem HUB_TLS_KEY=/tmp/hub/tls/key.pem \
            HUB_HOSTS_DIR=/tmp/hub/data HUB_DEV=1 HUB_FQDN=localhost _monitor/hub/install-hub.sh
          curl -fsS --cacert /tmp/hub/tls/cert.pem -H "Origin: https://www.evl.uic.edu" -D /tmp/h \
            https://localhost:6161/overview.json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          st = {h["id"]: h["status"] for h in d["hosts"]}
          assert st == {"ci": "live", "later": "planned"}, st
          print(st)'
          grep -qi "access-control-allow-origin: https://www.evl.uic.edu" /tmp/h
          curl -fsS --cacert /tmp/hub/tls/cert.pem https://localhost:6161/ci/history/1h.json >/dev/null
          docker inspect evl-monitor-hub --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.RestartPolicy.Name}}' | grep -qx 'true \[ALL\] always'
      - name: History survives a restart and a reinstall
        run: |
          points() { curl -fsS http://127.0.0.1:9877/history/1h.json | python3 -c 'import json,sys; print(sum(v is not None for v in json.load(sys.stdin)["host"]["cpu_pct"]["mean"]))'; }
          healthy() { for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9877/healthz >/dev/null 2>&1 && return 0; python3 -c 'import time; time.sleep(2)'; done; return 1; }
          python3 -c 'import time; time.sleep(30)'
          before=$(points)
          docker restart evl-monitor-agent
          healthy
          after_restart=$(points)
          sudo _monitor/agent/install.sh ci
          after_install=$(points)
          echo "points: before $before, after restart $after_restart, after reinstall $after_install"
          test "$before" -gt 0
          test "$after_restart" -ge "$before"
          test "$after_install" -ge "$before"
      - name: Logs
        if: always()
        run: |
          docker logs evl-monitor-agent 2>&1 | tail -50
          docker logs evl-monitor-hub 2>&1 | tail -50 || true
