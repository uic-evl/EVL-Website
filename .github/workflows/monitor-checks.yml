name: Monitor checks

on:
  pull_request:
    paths:
      - "_monitor/**"
      - "_data/monitor.yml"
      - "_pages/monitor.html"
      - "assets/js/monitor.js"
      - "_sass/_monitor.scss"
      - ".github/workflows/monitor-*.yml"
  push:
    branches:
      - deployment
    paths:
      - "_monitor/**"
      - "_data/monitor.yml"
      - "_pages/monitor.html"
      - "assets/js/monitor.js"
      - "_sass/_monitor.scss"
      - ".github/workflows/monitor-*.yml"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyyaml
      - name: No en or em dashes
        run: python _monitor/tools/check_dashes.py
      - name: Host list is valid
        run: python _monitor/tools/hosts.py
      - name: Page script parses
        run: |
          if [ -f assets/js/monitor.js ]; then node --check assets/js/monitor.js; fi
