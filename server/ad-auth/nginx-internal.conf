# nginx configuration for the /internal/ pages: form login backed by Active Directory.
# Include inside the server { } block for www.evl.uic.edu and remove the old auth_basic lines.
#
# How it works: every request under /internal/ is checked by the ad-auth service through
# auth_request. Without a valid session cookie the service answers 401, and nginx then serves the
# login page from the site (login/index.html) in place of the protected page. The status stays 401
# and no WWW-Authenticate header is sent, so the browser shows that page instead of its own
# password dialog. The form posts to /auth-ad/login, the service binds to AD, sets the cookie and
# sends the visitor back to the page they asked for. Scripts can still send HTTP Basic credentials.

# --- the ad-auth service -------------------------------------------------------------------

location = /auth-ad {
    internal;
    proxy_pass              http://127.0.0.1:8000/auth;
    proxy_http_version      1.1;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI $request_uri;
    proxy_set_header        X-Real-IP      $remote_addr;
    # Same restriction headers as nginx-ad-proxy; set the variables per location below.
    proxy_set_header        X-Auth-Groups  $xAuthGroups;
    proxy_set_header        X-Auth-Users   $xAuthUsers;
}

location = /auth-ad/login {
    limit_except POST { deny all; }
    proxy_pass              http://127.0.0.1:8000/login;
    proxy_http_version      1.1;
    proxy_set_header        X-Real-IP        $remote_addr;
    proxy_set_header        X-Forwarded-Proto $scheme;
}

location = /auth-ad/logout {
    proxy_pass              http://127.0.0.1:8000/logout;
    proxy_set_header        X-Real-IP        $remote_addr;
}

# --- the login page, public, deployed with the site from the repo's login/ folder ---------

location /login/ {
    try_files $uri $uri/ =404;
}

# --- the protected pages ---------------------------------------------------------------------

location /internal/ {
    set $xAuthGroups "";      # e.g. "EVL-Members"; empty = any authenticated user
    set $xAuthUsers  "";      # e.g. "renambot,papka"

    auth_request            /auth-ad;
    auth_request_set        $auth_user $upstream_http_x_auth_user;

    # Not signed in: show the login page instead of this page, keeping the URL and the 401.
    error_page 401 /login/index.html;
    # Signed in but not allowed: a plain message.
    error_page 403 /login/denied.html;

    try_files $uri $uri/ =404;
}
