[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evl-monitor"
version = "1.0.0"
description = "EVL server monitor agent: publishes host and GPU metrics as JSON"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9",
  "nvidia-ml-py>=12.560",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]
