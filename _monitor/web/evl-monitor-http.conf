# Generated by _monitor/tools/render_nginx.py from _data/monitor.yml. Do not edit.
# http context for the EVL monitor relay (see snippets/evl-monitor.conf).
proxy_cache_path /var/cache/nginx/evl-monitor levels=1:2 keys_zone=evlmon:2m max_size=64m inactive=10m use_temp_path=off;

# CORS for local page development only; production pages are same-origin
map $http_origin $evlmon_cors {
    default "";
    "~^http://(localhost|127\.0\.0\.1):(4000|8080)$" $http_origin;
}
