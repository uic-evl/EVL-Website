# EVL server monitor (www.evl.uic.edu/internal/monitor). This is the one host list.
#
# The page reads it (site.data.monitor), and the hub on arcade reads it to know which
# agents to poll (git pull on arcade picks up changes). Everything here is public:
# no SSH users, keys or addresses.
#
# status: live     the agent is deployed; the hub polls it
#         planned  shown as "Not reporting yet"; never polled
# gpu:    the host has NVIDIA GPUs

# where the page reads its data: the hub on arcade (see _monitor/README.md)
data_base: https://arcade.evl.uic.edu:6161
poll_seconds: 15

groups:
  - id: docc
    name: DOCC / ARCADE
    hosts: [arcade, arcade-ai-01, arcade-ai-02]
  - id: sage3
    name: SAGE3
    hosts: [sage200]
  - id: urbantk
    name: UrbanTK
    hosts: [utk]

hosts:
  arcade:
    name: ARCADE
    fqdn: arcade.evl.uic.edu
    status: live
    gpu: true
    gpus: 4x NVIDIA H100 80GB
    cpus: 2x Intel Xeon Platinum 8468
    memory: 1 TB
    role: NVIDIA NIM (Gemma 4), OpenWebUI, lab web apps
  arcade-ai-01:
    name: ARCADE AI 01
    fqdn: arcade-ai-01.evl.uic.edu
    status: planned
    gpu: true
    gpus: 4x NVIDIA H200 NVL (NVLink)
    cpus: 2x AMD EPYC 9555
    memory: 1.1 TB
  arcade-ai-02:
    name: ARCADE AI 02
    fqdn: arcade-ai-02.evl.uic.edu
    status: planned
    gpu: true
    gpus: 4x NVIDIA H200 NVL (NVLink)
    cpus: 2x AMD EPYC 9555
    memory: 1.1 TB
  sage200:
    name: SAGE200
    fqdn: sage200.evl.uic.edu
    status: live
    gpu: true
    gpus: 2x NVIDIA H200 NVL
    cpus: 2x AMD EPYC 9655
    memory: 1.5 TB
    role: LiteLLM gateway, Llama 4 Scout
  utk:
    name: UTK
    fqdn: utk.evl.uic.edu
    status: live
    gpu: true
    gpus: 1x NVIDIA RTX PRO 6000 Blackwell 96GB
    cpus: AMD EPYC 9354
    memory: 368 GB
    role: Urban Toolkit, GitHub Actions GPU runner
