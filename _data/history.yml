      - id: arcade
        year: 2025
        label: 2021–2026
        area: vis
        domain: platforms
        title: A building of its own, and the ARCADE
        marks:
          - { year: 2021, title: "Groundbreaking for the new building" }
          - { year: 2023, title: "DOCC begins" }
        body: |
          In 2021 UIC broke ground on the Computer Design Research and Learning Center, a 135,000-square-foot building on Taylor Street. In 2023 the lab began building DOCC, the Data Observation and Computation Collaboratory.

          On July 16, 2025 its centrepiece, the **ARCADE**, premiered at the building's opening: 98 LED cabinets in a wall about 28 feet wide, 4K and active stereo, with GPU servers on site and a 100-gigabit link back to EVL. In 2026 NASA's near-real-time Earth imagery came to the wall.
        media:
          - src: p4-arcade-cdrlc.jpg
            alt: The new building and the ARCADE's LED wall at its opening
            credit: Jim Young (College of Engineering), Dana M. Plepys and Lance Long (EVL)
        post: /news/2025/2025-07-16-2941/
        links:
          - { text: DOCC and the ARCADE, url: /projects/docc/ }

      - id: leadership
        timeline: false
        title: Leadership and continuity
        body: |
          Maxine Brown, associate director since 1986, became director in 2014 and retired in 2020; Andrew Johnson, director of research, led the lab as interim director until 2024. EVL turned fifty in September 2023 and told its own history in the journal *PRESENCE* in 2024.

          In September 2024 Michael E. Papka, an EVL alumnus who also directs the Argonne Leadership Computing Facility, became director, and in September 2026 Fabio Miranda was named deputy director. Dana Plepys retired in 2026 after 36 years as associate director.
        media:
          - src: p4-johnson-brown-cave2.jpg
            alt: Andrew Johnson and Maxine Brown in front of the CAVE2 sign
            credit: Lance Long, EVL
          - src: p4-papka.jpg
            alt: Michael E. Papka
            credit: EVL
        post: /news/2024/2024-09-16-2862/

      - id: continuum-testbed
        year: 2023
        label: 2023–2026
        area: hpc
        domain: earth
        title: A testbed across the computing continuum
        marks:
          - { year: 2026, title: "The Sage Summer of AI hackathon at EVL" }
        body: |
          The lab now works along the whole path data travels. At the edge, the sensors, cameras and AI nodes of the Sage project, the NAIRR Pilot and Sage Grande decide what to keep; in 2026 EVL hosted the Sage Summer of AI hackathon. In the middle, campus resource pools and shared walls let a group look at the data together. At the far end, leadership supercomputers such as Argonne's Aurora train, simulate and reanalyze at exascale.
        diagram: continuum
        media:
          - src: p4-edge-sensor-class.jpg
            alt: Students present an edge-based weather station sensor in an EVL classroom
            credit: EVL
        post: /news/2026/2026-07-20-3019/

      - id: collaborators
        timeline: false
        title: Who the lab works with
        body: |
          **Sponsors, over the decades:** NSF, DOE, NIH, DOD, NASA, DOT, the National Endowment for the Arts, Argonne National Laboratory, the State of Illinois, UIC, the Joseph and Bessie Feinberg Foundation, the Shirley Ryan AbilityLab, the Spencer Foundation and Procter & Gamble.

          **Disciplines inside UIC:** art, communication, design, dentistry, education, environmental sciences, health informatics, mathematics, medicine, neuroscience, public health and rehabilitation.

          The breadth is not opportunism. It is the 1973 structure still operating.
        media:
          - src: p4-cave2-mars.jpg
            alt: Two people study Mars and its rover imagery on the CAVE2 walls
            credit: EVL
          - src: p4-cave2-temple.jpg
            alt: A visitor in stereo glasses inside a panorama of an Egyptian temple
            credit: EVL

