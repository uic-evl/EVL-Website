  - id: part-05
    part: "05"
    years: Today
    title: Domain by domain
    cards: true
    dek: Today's work, one domain at a time. People whose work spans domains appear in each.
    opener:
      src: p5-opener-continuum.jpg
      alt: A Continuum wall showing brain imaging, heat maps and city data side by side
      credit: Luc Renambot, EVL
    steps:
      - id: cities
        summary: "OSCUR, the Urban Toolkit and Curio: open tools that turn city data into answers."
        year: 2024
        label: 2016–2026
        area: vis
        domain: cities
        title: Cities
        mark_title: "OSCUR begins"
        marks:
          - { year: 2016, title: "OpenGrid launches at EVL" }
          - { year: 2021, title: "Environmental-justice maps of Chicago" }
          - { year: 2023, title: "The Urban Toolkit" }
          - { year: 2025, title: "Urbanite and StreetWeave" }
        body: |
          Chicago has long been a test bed. The City launched its OpenGrid platform at EVL in 2016, and environmental-justice maps built with UIC's School of Public Health (2021–25) put polluting sites next to homes and schools.

          Fabio Miranda's group builds the **Urban Toolkit**: UTK, a grammar for urban visualization (IEEE VIS 2023); **Curio**, a dataflow framework for collaborative urban analytics (VIS 2024); Urbanite and StreetWeave (VIS 2025); Autark (2026); and machine learning for shade and sidewalks (Deep Umbra, Tile2Net).

          **OSCUR**, an NSF software-institutes collaboration with NYU and the University of Washington (2024–2029), turns these into open cyberinfrastructure for urban computing. Curio already runs in UIC courses.
        media:
          - src: p5-cities-continuum.jpg
            alt: Fabio Miranda and a colleague with a 3D city model on the Continuum wall
            credit: EVL
          - src: p5-cities-curio.jpg
            alt: Curio dataflows for urban accessibility, climate and sunlight studies
            credit: EVL
        post: /news/2024/2024-09-01-2838/
        links:
          - { text: The Urban Toolkit, url: /projects/urban-miranda/ }
          - { text: oscur.org, url: "https://oscur.org/" }

      - id: biomedicine
        summary: "From the Visible Embryo to cancer risk calculators used in clinics."
        year: 2015
        label: 1987–2026
        area: vis
        domain: biomed
        title: Biomedicine
        mark_title: "G. Elisabeta Marai joins"
        marks:
          - { year: 1987, title: "LEGS, a legged alternative to the wheelchair", area: hci }
          - { year: 1992, title: "The Visible Embryo" }
          - { year: 1997, title: "The Virtual Temporal Bone", area: hci }
          - { year: 2012, title: "CAVE2 catches an error in a brain-vessel model", area: hci }
          - { year: 2017, title: "NIH-funded cancer work begins" }
          - { year: 2024, title: "The DITTO treatment digital twin" }
          - { year: 2026, title: "New NIH awards: lymphedema and taste loss" }
        body: |
          The thread runs from a legged alternative to the wheelchair (1987) and the Visible Embryo (1992) through the Virtual Temporal Bone (1997) to brain-vessel models in CAVE2 (2012).

          Since G. Elisabeta Marai joined in 2015 it has become a program. With MD Anderson, the University of Iowa and the University of Minnesota, and with NIH funding since 2017, her group works on head-and-neck cancer: risk calculators now used in clinics, THALIS and symptom-cluster analysis, and the DITTO treatment digital twin, all grounded in her activity-centered design framework (IEEE VIS 2017).

          In 2026 two new NIH awards followed: smartphone computer vision for lymphedema, with Wei Tang, and *Flavor Charter* for patients who lose their sense of taste. Marai also co-directs UIC's institute for equitable health data science, and Saeed Boorboor (2025) brings immersive biomedical visualization.
        media:
          - src: p5-biomed-cave2.jpg
            alt: G. Elisabeta Marai with co-investigators in CAVE2
            credit: Lance Long, EVL
          - src: p5-biomed-risk-calculator.jpg
            alt: The interface of a head-and-neck cancer risk calculator
            credit: EVL
        post: /news/2021/2021-03-01-2540/
        links:
          - { text: Head-and-neck cancer decision support, url: /projects/cancer-marai/ }

      - id: perception
        summary: "How people see and reason with charts, from overdose dashboards to models of vision."
        year: 2025
        area: vis
        domain: biomed
        title: Public health and perception
        mark_title: "Modeling human vision to evaluate charts"
        marks:
          - { year: 2021, title: "EuroVis Best Paper on color names" }
        body: |
          Khairi Reda, an EVL alumnus who returned in 2025, studies how people actually see, reason and decide with charts. In Indiana he helped build real-time dashboards of the services people used before fatal overdoses, used by health teams county by county (NIH HEAL Data2Action).

          His EuroVis 2021 Best Paper, with Papka, showed that how easily a chart's colors can be named predicts how well people read it. A 2026 NSF award with Boorboor and Papka models human vision so a visualization can be evaluated without a user study for every design.
        media:
          - src: p5-reda-boorboor.jpg
            alt: Khairi Reda and Saeed Boorboor
            credit: EVL
        post: /news/2026/2026-07-30-3027/

      - id: systems
        summary: "Supercomputers, edge AI and digital twins, from Aurora to a sensor on a pole."
        year: 2023
        area: hpc
        domain: science
        title: Systems and AI at scale
        mark_title: "In situ visualization on Argonne's machines"
        marks:
          - { year: 2022, title: "The C²P² traineeship", domain: learning }
          - { year: 2024, title: "AIMCI: AI that runs facilities", domain: platforms }
          - { year: 2025, title: "EcoHPC: power as a schedulable resource" }
        body: |
          Michael Papka's work runs from the Argonne Leadership Computing Facility and Aurora to the edge: the C²P² computational-physics traineeship (DOE), the NAIRR Pilot's edge-AI testbed and its software workshop, and DAIMSL digital twins for robotic laboratories.

          Zhiling Lan's AIMCI uses AI to run whole facilities, EcoHPC makes power a schedulable resource, and Tachyon builds a digital twin of the DUNE data pipeline. Sidharth Kumar makes massive simulation data small and fast, from declarative analytics at scale (PPoSS) to compact learned Gaussian models of huge volumes. Victor Mateevitsi visualizes simulations while they run (SC23 ISAV Best Paper), and Luc Renambot and Boorboor build AI assistants for scientific data with Argonne.

          Miranda's tools sit here too: Urbanite keeps LLM-assisted dataflows aligned with what the analyst meant, Curio's agent catalog explains steps and finds data, and Autark runs GPU-accelerated geospatial computation entirely in the browser.
        media:
          - src: p5-systems-insitu.jpg
            alt: In situ visualization of a fluid simulation running on a supercomputer
            credit: EVL
          - src: p5-systems-gaussians.jpg
            alt: Volume data reconstructed from a compact learned Gaussian model
            credit: EVL
        post: /news/2023/2023-11-12-2786/

      - id: learning
        summary: "Social robots, touch interfaces, VIVES in Chicago Public Schools, and a new degree."
        year: 2022
        label: 2019–2026
        area: hci
        domain: learning
        title: Learning and interaction
        mark_title: "The joint BS in Computer Science and Design"
        marks:
          - { year: 2025, title: "CPS teachers' workshop at EVL", area: vis }
          - { year: 2026, title: "VIVES in Chicago Public Schools", area: vis }
        body: |
          Joseph Michaelis builds social robots as companions for learning, and tools such as PATHWiSE that let teachers author robot-guided homework. Nikita Soni designs touch and speech interfaces for learners, including spherical displays for future science teachers. Andruid Kerne's Interface Ecology Lab studies creativity and embodied interaction, Debaleena Chattopadhyay designs interfaces people can trust, Hyungil Kim studies the human factors of augmented and extended reality, and Steve Jones studies human–machine communication.

          Miranda's **VIVES**, *Visualizing Infrastructure for Vigorous Environmental Science in Chicago Public Schools* (Spencer Foundation, 2026–2029), grew out of a 2025 workshop at EVL with CPS science teachers: UIC, CPS classrooms and community partners use data visualization and youth participatory science to bring environmental science back into the curriculum.

          And since fall 2022 the joint BS in Computer Science and Design, co-founded by Daria Tsoupikova, has brought a new kind of student into the lab's rooms.
        media:
          - src: p5-learning-classroom.jpg
            alt: A large class working on laptops in front of EVL's display walls
            credit: EVL
          - src: p5-environmental-justice.jpg
            alt: An environmental-justice map of Chicago showing polluting sites
            credit: EVL
        post: /news/2025/2025-06-26-2934/
        links:
          - { text: VIVES, url: /projects/vives-miranda/ }

      - id: vision
        summary: "Machines that understand people, objects and 3D scenes in images and video."
        year: 2025
        label: 2019–2026
        area: vis
        domain: science
        title: Seeing machines
        mark_title: "NSF CAREER award for Wei Tang"
        body: |
          Wei Tang's group teaches machines to understand people, objects and 3D scenes in images and video: 3D human pose estimation, part-whole 3D reconstruction learned from photo collections, and robust multi-object tracking, published at CVPR and ICCV.

          In 2025 he received an NSF CAREER award for compositional learning of the physical world, and his vision work now powers the lymphedema project with Marai.
        media:
          - src: p5-vision-partwhole.jpg
            alt: Photos of two birds beside their reconstructed 3D models, with parts in color
            credit: Wei Tang, EVL
        post: /news/2025/2025-07-01-2932/

      - id: art-now
        summary: "Hearts and Minds, Hummingbird, Chicago Design Milestones and Sandin's newest work."
        year: 2021
        label: 2014–2026
        area: art
        domain: arts
        title: Art and immersive storytelling
        mark_title: "Hummingbird at the Goodman Theatre"
        marks:
          - { year: 2014, title: "Hearts and Minds premieres in CAVE2" }
          - { year: 2019, title: "Chicago Design Milestones" }
          - { year: 2022, title: "Chicago design on Art on theMART" }
          - { year: 2025, title: "The Image Processor, revived" }
        body: |
          The art half of the lab never left. Daria Tsoupikova's *Hearts and Minds* premiered in CAVE2 in 2014 and won the Robert Coover Award in 2016; *Chicago Design Milestones* filled the 150 Media Stream wall in 2019; *Hummingbird*, live theatre merged with multi-user virtual reality, played the Goodman Theatre's New Stages festival in 2021, staged at EVL; and in 2022 her team put a century of Chicago design on Art on theMART.

          Dan Sandin keeps making work: *Particle Dreams in Spherical Harmonics* (2014), a 16K stereo camera (2019), and in 2025 a public revival of his Image Processor.
        media:
          - src: p5-art-hummingbird.jpg
            alt: Virtual scenery and performers from Hummingbird
            credit: EVL
          - src: p5-art-particle-dreams.jpg
            alt: Visitors in CAVE2 inside Dan Sandin's Particle Dreams
            credit: Lance Long, EVL
        post: /news/2021/2021-12-03-2603/

      - id: earth
        summary: "From GeoWall classrooms to NASA's Earth imagery on the ARCADE wall."
        year: 2026
        label: 2001–2026
        area: vis
        domain: earth
        title: Earth and environment
        mark_title: "NASA Earth on the ARCADE wall"
        marks:
          - { year: 2019, title: "Seeing aircraft contrails" }
          - { year: 2023, title: "ProWis weather ensembles" }
        body: |
          Earth has been a domain since GeoWall: a forest in Panama in CAVE2 (2015), aircraft contrails (2019), ProWis for weather-forecast ensembles (IEEE VIS 2023 Best Paper Honorable Mention), Sage edge sensors measuring weather and air from 2023, and in 2026 NASA's near-real-time Earth imagery on the ARCADE wall.

          That year Papka gave the keynote at NASA's ESTIM meeting, held at theMART in Chicago. This page is adapted from that talk.
        media:
          - src: p5-earth-nasa-arcade.jpg
            alt: NASA Earth imagery on the ARCADE's LED wall
            credit: EVL
        post: /news/2026/2026-09-08-3026/

      - id: recognition
        summary: "Test-of-time awards, best papers, fellowships and a CAREER award."
        timeline: false
        title: Recognition
        body: |
          - **2021** · EuroVis Best Paper, for color nameability and chart reading (Reda, with Papka)
          - **2021** · ISMB BioVis 10-year Test of Time, for RuleBender (Marai)
          - **2022** · Kavli Fellow of the National Academy of Sciences (Miranda)
          - **2023** · LDAV and ISAV best papers, and first place in the SciVis Contest
          - **2024** · ACM Distinguished Member (Papka)
          - **2025** · SAGE named one of UIC's top ten innovations
          - **2025** · NSF CAREER award (Tang)
          - **2025** · IEEE VIS 20-year Test of Time, for *Graph-theoretic scagnostics* (2005) by the late EVL faculty member Leland Wilkinson, EVL alumna Anushka Anand and Robert Grossman
          - **2026** · Tom DeFanti named one of HPCwire's 35 HPC Legends
        media:
          - src: p5-recognition-scagnostics.jpg
            alt: "Scagnostics: the convex hull, alpha hull and minimum spanning tree of a scatterplot"
            credit: Wilkinson, Anand and Grossman, 2005
        post: /news/2025/2025-11-02-2989/

      - id: art-on-the-mart
        summary: "Fall 2026: Argonne and EVL's science projected across theMART."
        year: 2026
        area: art
        domain: arts
        title: Where Data Becomes Light
        marks:
          - { year: 1989, title: "Sandin, Hart and Kauffman ray-trace 3D fractals", area: vis }
        body: |
          From September 10 to November 15, 2026, Art on theMART, the largest permanent digital art projection in the world, carried *Where Data Becomes Light: The Beauty of Scientific Visualization*, a collaboration between Argonne and EVL led by Papka and Tsoupikova.

          It turns data from cosmology, Earth science, biomedical research, materials discovery, physics, chemistry and AI into public animation across 2.5 acres of river-facing wall, alongside Sandin's fractals: quaternion Julia sets that he, John Hart and the UIC mathematician Lou Kauffman learned to ray-trace in three dimensions for SIGGRAPH '89. It is the 1973 collaboration of science and art, outdoors and free to anyone walking by.
        media:
          - src: p5-art-on-the-mart-2026.jpg
            alt: Scientific visualization projected across theMART's river facade at night
            credit: Art on theMART, Argonne and EVL
        post: /news/2026/2026-09-06-3024/

  # ---------------------------------------------------------------------------
  - id: part-06
    part: "06"
    years: 1973–today
    title: What EVL enables
    dek: Fifty years of instruments, networks, software and people, measured by what they made possible for others.
    data: true
    steps:
      - id: rooms
        timeline: false
        diagram: lineage
        title: Rooms others built
        body: |
          EVL publishes its designs and helps others build them. Within a year of its debut the CAVE was running at NCSA and Argonne, with a fourth built for ARPA. Pyramid Systems licensed it in 1994, a line Fakespace and Mechdyne carried on, and CAVEs went up at dozens of institutions. The ImmersaDesk went commercial in 1998, and CAVE2 was licensed in 2013, the year Monash University opened the second one.

          That is what success looks like for infrastructure research: the acronym became a common noun.

      - id: networks
        timeline: false
        diagram: starlight
        title: Networks others use
        body: |
          STAR TAP gave the world's research networks one place to meet US research networks, and StarLight has been that place since 2001: an open exchange in Chicago where national and international research-and-education networks connect, and where demonstrations from iGrid onward have moved science data across oceans.

          The lab built the part every collaboration depends on, and others have used it for a quarter of a century.

      - id: software
        timeline: false
        chart: software
        title: Software others run
        body: |
          SAGE turned display walls into shared canvases for groups: by 2018 SAGE2 had more than 4,000 users at more than 800 institutions in 18 countries, and SAGE walls now number in the hundreds.

          Today the lab's open-source work runs from SAGE3 to the Urban Toolkit, and other people install it every day.
        stats:
          - { value: "live: repositories", label: open-source repositories }
          - { value: "live: downloads", label: "live: downloads-label" }
        links:
          - { text: Impact, url: /impact/ }
          - { text: Repositories, url: /repositories/ }

      - id: people
        timeline: false
        title: People others hire
        body: |
          **Film and games:** Pixar, Disney Animation, Weta Digital, Digital Domain, Rhythm & Hues, Amazon Games, Midway. **Industry:** Apple, Google, Amazon, Microsoft, General Motors, Qualcomm, Motorola, Mechdyne. **Research labs:** Argonne, NASA Goddard, Northrop Grumman, the Qualcomm Institute. **Universities:** Hawaiʻi at Mānoa, Buffalo, Indiana, Massachusetts, San Francisco State, USC Cinema, Chicago.

          The phrase inside the lab is that no one ever leaves EVL.
        stats:
          - { value: "live: alumni", label: alumni on record }
          - { value: "live: ms", label: master's degrees }
          - { value: "live: mfa", label: MFAs }
          - { value: "live: phd", label: PhDs }
        stats_note: Degrees as recorded on the Members page; the early decades are incomplete.
        media:
          - src: p3-evlers-cave2-floor.jpg
            alt: A fisheye view of EVL members lying in a circle on the CAVE2 floor
            credit: EVL
        links:
          - { text: Members, url: /people/ }

      - id: science
        timeline: false
        title: Science others do
        body: |
          - **Medicine.** In 2012 neurosurgeons studying a patient's brain-vessel model in CAVE2 spotted a wrong connection within five minutes. Today oncologists use head-and-neck cancer risk calculators built at EVL.
          - **Earth.** GeoWall put stereo in geoscience classrooms for about $10,000. Sage nodes now sense weather and air in seventeen states.
          - **Cities.** Planners, students and community groups build analyses in Curio and the Urban Toolkit.
          - **Physics and computing.** I-WAY drove remote supercomputers live from a show floor; in situ visualization now watches simulations on Argonne's machines while they run.
          - **Art and the public.** Artists with no programming background made work on the UV-1, and museums, theatres and theMART's riverfront have shown what the lab makes.
        media:
          - src: p5-biomed-brain-vessels.jpg
            alt: Neurosurgeons and researchers study a brain-vessel model on the CAVE2 walls
            credit: Lance Long, EVL

    method: |
      **Software.** Repositories and package downloads are the figures on the [Impact](/impact/) page, counted when the site was last built.

epilogue:
  bookend:
    title: Art or engineering?
    text: >-
      It is the question newcomers are asked on their first day at EVL. Fifty years in, the
      answer is the one the lab was founded on: all of us are at least a little of both.
    src: epilogue-design-milestones.jpg
    alt: Chicago Design Milestones 1920–2019 on the 150 Media Stream wall
    credit: Daria Tsoupikova, EVL
  visit: >-
    Engineering Research Facility, 842 W Taylor Street, Chicago. Visitors welcome, and the espresso
    machine still works.
