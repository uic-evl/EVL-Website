# Content for the "50+ Years" page (an unlisted draft at /internal/history/). Rendered by _includes/history/*.liquid.
#
# Each chapter is a list of steps, one beat of the story each. Step fields:
#   id        anchor on the page (unique)
#   year      year used on the timeline guide (the first year of a range)
#   label     year shown to readers, when it differs from `year` (e.g. "1976–77")
#   area      vis | art | hci | hpc          colour on the timeline (lanes in this order)
#   domain    platforms | arts | science | biomed | earth | cities | learning
#                                             lane on the timeline (Domain view)
#   timeline  false to leave a step off the timeline guide
#   title     short title, also the timeline tooltip
#   body      Markdown
#   media     one to four images in assets/img/history/ (omit to keep the previous one)
#   diagram   a drawn diagram (see _includes/history/diagram.liquid)
#   specs     label/value rows, shown under the body
#   stats     big numbers, shown under the body ("live: …" values are computed at build)
#   people    the faculty grid (Part 04)
#   chart     a Part 06 chart id
#   post      the step's original news post
#   links     extra links: [{ text, url }]
#   mark_title  the step's label on the timeline guide, when it differs from `title`
#   marks     more dates this step tells about, each a dot on the timeline that opens
#             the step: [{ year, title }] (area and domain default to the step's)
#
# Only what the story tells appears on the timeline guide.

hero:
  title: Fifty years at the Electronic Visualization Laboratory
  dek: >-
    In 1973 a video artist and a computer scientist shared a room, a PDP-11 and an audience.
    What grew from that room built the CAVE, wired the world's research networks to Chicago,
    taught walls of screens to work as one, and still asks every newcomer the same question:
    art or engineering?
  then:
    src: hero-1973-habitat.jpg
    alt: The Circle Graphics Habitat's PDP-11 racks and Vector General display, a wireframe Death Star on its screen
    credit: Steve Heminover
  now:
    src: hero-2026-arcade.jpg
    alt: Students working at the ARCADE's LED wall in the Computer Design Research and Learning Center
    credit: EVL
  numbers:
    - value: "1973"
      label: Founded as the Circle Graphics Habitat, by computer science and art
    - value: "1992"
      label: The CAVE debuts at SIGGRAPH in Chicago
    - value: "800+"
      label: Papers, theses and articles in the lab's publication record
    - value: "live: alumni"
      label: Alumni on record, from film studios to national laboratories

chapters:
  # ---------------------------------------------------------------------------
  - id: part-01
    part: "01"
    years: 1973–1989
    start: 1973
    end: 1990
    title: Art and engineering
    dek: A video artist and a computer scientist share a room, a PDP-11 and an audience.
    opener:
      src: p1-opener-video-art.jpg
      alt: Two faces rendered in blue by real-time analog video processing
      credit: EVL
    steps:
      - id: founders
        year: 1973
        label: 1969–1973
        area: art
        domain: arts
        title: Two founders, two colleges
        body: |
          Dan Sandin came to UIC's School of Art and Design in 1969, trained in physics and carrying the idea for a video synthesizer. Tom DeFanti arrived from Ohio State in 1973 with GRASS, the graphics language of his PhD, hired at first to write instructional graphics for the chemistry department, which owned a PDP-11/45 and a Vector General display.

          In September 1973 the two founded the **Circle Graphics Habitat**, named for the university's Chicago Circle campus: a joint program of engineering and art, and the start of what became the Electronic Visualization Laboratory.
        media:
          - src: p1-defanti-1971.jpg
            alt: Tom DeFanti in 1971
            credit: EVL
          - src: p1-sandin-ip.jpg
            alt: Dan Sandin seated beside the patch panels of his Image Processor
            credit: PRESENCE 33 (2024), CC BY 4.0
        post: /news/1973/1973-09-01-2084/

      - id: founding-brief
        year: 1973
        area: hci
        domain: platforms
        title: The founding brief
        body: |
          The brief was practical from the start. Make graphics **user-oriented** and **easy to learn**. Keep them **low-cost**, so they reach people. Make them **interactive and real time**, so the person at the controls sees the result at once and can keep steering.

          The Habitat put the machines and the people in one room. That is still how the lab works.
        media:
          - src: p1-habitat-equipment.jpg
            alt: The PDP-11 racks beside the Vector General display and its control boxes
            credit: Steve Heminover
        post: /news/1976/1976-06-07-2161/

      - id: image-processor
        year: 1973
        label: 1971–1973
        area: art
        domain: platforms
        title: The Sandin Image Processor
        body: |
          Sandin's Image Processor was a modular, patch-programmable analog computer for video, modelled on the Moog synthesizer. Performers colorized, keyed and fed back live camera images in real time, a decade before affordable digital frame buffers.

          He published the plans and gave the design away, so other artists could build their own. Latency: none you could perceive. Operator: a performer at the controls.
        media:
          - src: p1-sandin-ip-patch.jpg
            alt: Cables patched across the Image Processor's modules
            credit: Dan Sandin, EVL
        post: /news/1971/1971-01-01-1934/

      - id: eve
        year: 1975
        area: art
        domain: arts
        title: The Electronic Visualization Events
        body: |
          On April 15, 1975 the group staged the first Interactive Electronic Visualization Event in the rotunda of the Science and Engineering South building: live GRASS graphics, the Image Processor and Bob Snyder's synthesized music, open to the city. More events followed.

          The words *Electronic Visualization* first appear here; they later named the program and the lab. So did a habit the lab never lost: building things that have to work in front of an audience on a fixed date.
        media:
          - src: p1-ieve-1975.jpg
            alt: Members of the group around the Image Processor's patch panels, one holding a sign that reads COMPUTER
            credit: EVL
        post: /news/1975/1975-04-15-2086/

      - id: death-star
        year: 1976
        label: 1976–77
        area: vis
        domain: arts
        title: A wireframe Death Star
        body: |
          In 1976 the artist Larry Cuba came to the Habitat and animated the Death Star briefing sequence for the first *Star Wars* film in GRASS, on the lab's PDP-11 and Vector General.

          The instrument was open to visiting practitioners. That is how a university graphics lab ended up in the visual vocabulary of a generation.
        media:
          - src: p1-death-star-vector-general.jpg
            alt: The Vector General display showing the wireframe Death Star
            credit: © 2013 Steve Heminover
        post: /news/1976/1976-05-01-2093/

      - id: sayre-glove
        year: 1977
        label: 1976–77
        area: hci
        domain: platforms
        title: The Sayre Glove
        body: |
          Built on an idea by Rich Sayre and funded by the National Endowment for the Arts, the Sayre Glove was the first data glove. Flexible tubes ran along each finger with a light at one end and a photocell at the other, so bending a finger dimmed the light.

          Sandin and DeFanti built it cheaply, as a way to steer graphics with the hand, years before virtual reality had a name.
        media:
          - src: p1-sayre-glove.jpg
            alt: A glove with flexible sensor tubes and wires running along each finger
            credit: Courtesy Dan Sandin, EVL
        post: /news/1977/1977-01-01-2162/

      - id: zgrass
        year: 1977
        label: 1977–1987
        area: hci
        domain: platforms
        title: Graphics for people who are not programmers
        marks:
          - { year: 1980, title: "The Datamax UV-1, a low-cost Zgrass machine" }
          - { year: 1987, title: "The Interactive Image at the Museum of Science and Industry" }
        body: |
          In 1977 Bally/Midway's game group hired DeFanti to port GRASS to its Z-80 *Z-Box*. The result, Zgrass, was rebuilt for raster graphics and sprites, but Midway never released it, so the Circle group built its own low-cost machine around it: the Datamax UV-1 (1980–81).

          Artists with no programming background used it to make real work. In 1987 *The Interactive Image* at Chicago's Museum of Science and Industry ran on UV-1s.
        media:
          - src: p1-uv1-artists.jpg
            alt: Artists and students sitting with a Datamax UV-1, its keyboard and monitor
            credit: EVL
          - src: p1-grass-still.jpg
            alt: Points of light swept into a spiral by a GRASS program
            credit: EVL
        post: /news/1973/1973-01-01-1935/

      - id: spiral-ptl
        year: 1980
        label: 1978–1983
        area: art
        domain: arts
        title: A program, a museum, a name
        marks:
          - { year: 1983, title: "Spiral PTL enters MoMA's video collection" }
        body: |
          By 1978 the lab's video and computer courses had been formalized as the Electronic Visualization Program, and the Habitat took the same name: the Electronic Visualization Laboratory.

          In 1980 Sandin, DeFanti and Mimi Shevitz made *Spiral PTL* on lab equipment, with the lab's own language and video instrument. The Museum of Modern Art screened it in 1982 and added it to its first video collection in 1983; the Video Data Bank holds it too.

          An MFA in Electronic Visualization sat beside graduate study in computer science, what EVL has long described as the country's first science-and-art degree program. The pairing returned in fall 2022, when UIC launched a joint BS in Computer Science and Design.
        media:
          - src: p1-spiral-ptl.jpg
            alt: Nine stills from Spiral PTL, spirals and starbursts of light
            credit: Dan Sandin, Tom DeFanti and Mimi Shevitz, Spiral PTL, 1980
        post: /news/2018/2018-10-15-2404/

      - id: phscolograms
        year: 1984
        label: 1984–1992
        area: vis
        domain: arts
        title: Depth without glasses
        marks:
          - { year: 1989, title: "The PHSCologram patent is filed" }
        body: |
          From 1984 EVL worked with Ellen Sandor's (art)n on PHSColograms: computer-generated barrier-strip autostereograms, images with real depth and no glasses. A fine black barrier in front of interleaved image strips shows each eye a different picture. The patent was filed in 1989 and issued in 1992.

          A durable interest started here: give up the headgear wherever the physics allows it.
        diagram: phscologram
        post: /news/1989/1989-09-01-1340/

      - id: visc
        year: 1987
        label: 1979–1987
        area: vis
        domain: science
        title: Visualization in Scientific Computing
        mark_title: "The NSF report on visualization in scientific computing"
        marks:
          - { year: 1979, title: "The first SIGGRAPH Video Review" }
          - { year: 1981, title: "DeFanti becomes chair of ACM SIGGRAPH" }
          - { year: 1986, title: "Maxine Brown joins EVL" }
        body: |
          In February 1987 a National Science Foundation panel on graphics, image processing and workstations, co-chaired by Bruce McCormick and DeFanti, gathered researchers, industry and federal agencies in Washington. That November McCormick, DeFanti and Maxine Brown published its report, *Visualization in Scientific Computing*. It helped establish scientific visualization as a field, and it set the direction of the lab's next decade.

          The report grew out of years of community building. DeFanti co-chaired SIGGRAPH '79, launched the SIGGRAPH Video Review and chaired ACM SIGGRAPH from 1981 to 1985; Brown joined EVL as associate director in 1986.
        media:
          - src: p1-visc-1987.jpg
            alt: Cover of the 1987 report Visualization in Scientific Computing
            credit: ACM SIGGRAPH Computer Graphics 21(6), 1987
        post: /news/1987/1987-11-01-2163/

    interlude:
      kicker: What the first fifteen years established
      items:
        - n: "01"
          title: Build the instrument
          text: If the display, the language or the network you need does not exist, that is the research.
          src: p1-interlude-cavecam.jpg
          alt: CAVEcam, a twin-lens stereo camera built at EVL
        - n: "02"
          title: Keep it in the room
          text: Faculty, staff and students at desks beside the hardware they use. Proximity is a research method.
          src: p1-interlude-cave2-room.jpg
          alt: A group working at tables inside CAVE2, the walls lit with data
        - n: "03"
          title: Hand it to an outsider
          text: An artist, a neurosurgeon, a climate modeller. If they can use it, it works.
          src: p1-interlude-cave2-surgeons.jpg
          alt: Neurosurgeons in white coats study a brain-vessel model on the CAVE2 wall

  # ---------------------------------------------------------------------------
  - id: part-02
    part: "02"
    years: 1990–1999
    start: 1990
    end: 2001
    title: The room and the network
    dek: A walk-in virtual environment, and the international infrastructure it made necessary.
    opener:
      src: p2-opener-cave-siggraph92.jpg
      alt: The CAVE's black enclosure on the SIGGRAPH '92 show floor in Chicago
      credit: EVL
    steps:
      - id: cave
        year: 1992
        label: 1991–1992
        area: hci
        domain: platforms
        title: The CAVE
        body: |
          In 1991, the year EVL moved into the space it still occupies, Carolina Cruz-Neira, Sandin and DeFanti invented the CAVE: rear-projected stereo on the walls and floor of a room you walk into, with head tracking. You wear light glasses and can still see your own hands, your notes and your colleagues.

          It debuted in summer 1992 at the SIGGRAPH Showcase at McCormick Place, which DeFanti ran while Maxine Brown chaired the conference, and became the first widely replicated, projection-based, walk-in virtual reality system in the world.
        citation: >-
          Cruz-Neira, Sandin, DeFanti, Kenyon and Hart. The CAVE: audio visual experience automatic virtual
          environment. Communications of the ACM 35(6), June 1992.
        media:
          - src: p2-cave-entrance-1992.jpg
            alt: Visitors queuing at the CAVE entrance at SIGGRAPH '92
            credit: PRESENCE 33 (2024), CC BY 4.0
        post: /news/1992/1992-06-01-1299/

      - id: cave-room
        year: 1992
        area: hci
        domain: platforms
        timeline: false
        title: What was in the room
        body: |
          The design put the projectors behind the walls and the people inside.
        specs:
          - { label: Enclosure, value: "Three rear-projected walls and a down-projected floor, roughly a 10-foot cube" }
          - { label: Stereo, value: "CrystalEyes shutter glasses at 120 Hz, 60 Hz per eye" }
          - { label: Tracking, value: "Electromagnetic: one tracked head, one wand" }
          - { label: Compute, value: "Four SGI Crimson VGX workstations, one per surface" }
          - { label: Occupancy, value: "A group: one pilot, several passengers, all able to talk" }
          - { label: Debut, value: "SIGGRAPH '92, Chicago" }
        media:
          - src: p2-cave-diagram-cacm.jpg
            alt: Diagram of the CAVE, projectors aimed at three walls and the floor around a standing viewer
            credit: Communications of the ACM, 1992

      - id: replication
        year: 1993
        label: 1993–2007
        area: hci
        domain: science
        title: Replication as a research strategy
        marks:
          - { year: 1994, title: "VROOM: 40+ projects in three CAVEs" }
          - { year: 2007, title: "IEEE VGTC award for the CAVE's inventors" }
        body: |
          Publish the design, help others build it, and let the next generation of research questions come back from other laboratories. NCSA and Argonne built CAVEs in 1993, and EVL built a fourth for ARPA. In 1994 Pyramid Systems licensed it, a line later carried on by Fakespace and Mechdyne, and SIGGRAPH '94's VROOM showed more than 40 projects in three CAVEs.

          The acronym became a common noun. In 2007 Cruz-Neira, DeFanti and Sandin received the IEEE VGTC Virtual Reality Technical Achievement Award.
        media:
          - src: p2-cave-group.jpg
            alt: Three visitors in stereo glasses inside a CAVE, a virtual city around them
            credit: EVL
        post: /news/2007/2007-03-10-752/

      - id: lineage
        year: 1994
        label: 1994–1998
        area: hci
        domain: platforms
        title: The CAVE lineage
        marks:
          - { year: 1996, title: "ImmersaDesk2" }
          - { year: 1997, title: "The Infinity Wall" }
          - { year: 1998, title: "PARIS, augmented reality on a desk" }
        body: |
          Each descendant traded one property of the original for reach.

          The **ImmersaDesk** (1994) folded the CAVE into a drafting table that fits through a doorway, ships to a conference and sits in a working lab; the ImmersaDesk2 (1996) packed into a flight case. The **Infinity Wall** (1997) was large-format stereo for audiences rather than pilots. **PARIS** (1998) put the user's own hands into the scene: augmented reality on a desk.
        media:
          - src: p2-immersadesk-render.jpg
            alt: Rendering of the ImmersaDesk
            credit: Alan Cruz, EVL
          - src: p2-paris.jpg
            alt: A researcher working with the PARIS augmented-reality display
            credit: Chris Scharver, EVL
        post: /news/1994/1994-01-01-1770/

      - id: iway
        year: 1995
        area: hpc
        domain: science
        title: I-WAY at SC'95
        body: |
          For one week in December 1995, Argonne, NCSA and EVL ran I-WAY: a wide-area experiment linking 17 sites over ATM networks, driving remote supercomputers and immersive displays live from the Supercomputing '95 floor in San Diego for more than 60 application groups.

          Its middleware problems became the agenda of grid computing for the next decade, starting with the Globus project.
        stats:
          - { value: "17", label: sites }
          - { value: "1", label: week to prove it }
        media:
          - src: p2-iway-map.jpg
            alt: Map of the I-WAY's network connections across the United States
            credit: DeFanti, Foster, Papka, Stevens and Kuhfuss, 1996
        post: /news/1995/1995-12-04-317/

      - id: tele-immersion
        year: 1997
        label: 1996–1998
        area: hci
        domain: science
        title: Distance as a design constraint
        marks:
          - { year: 1996, title: "NICE, a shared virtual garden for children", domain: learning }
          - { year: 1998, title: "The first iGrid" }
        body: |
          Tele-immersion joined CAVEs in different cities into one virtual room, with avatars, shared objects and voice. Latency, jitter and packet loss stopped being network statistics and became things people could feel.

          CAVERNsoft (1997) gave developers a toolkit for it, NICE let children tend a shared virtual garden, and in 1998 the first iGrid gathered international research networks at SC'98. The lab acquired a networking research program.
        media:
          - src: p2-teleimmersion-chicago.jpg
            alt: A participant in Chicago working beside the avatar of a remote collaborator
            credit: EVL
          - src: p2-teleimmersion-avatars.jpg
            alt: Four avatars of collaborators at the other end of the link
            credit: EVL
        post: /news/1998/1998-03-25-1248/

      - id: star-tap
        year: 1997
        area: hpc
        domain: platforms
        title: STAR TAP
        marks:
          - { year: 1999, title: "Euro-Link" }
        body: |
          If people were going to meet across oceans, their networks had to meet somewhere. In 1997 NSF funded STAR TAP, the Science, Technology And Research Transit Access Point, with DeFanti as principal investigator: a persistent place in Chicago where international research networks could peer with US research networks. Euro-Link followed in 1999.
        diagram: startap
        post: /news/1997/1997-05-01-365/

      - id: starlight
        year: 2001
        area: hpc
        domain: platforms
        title: StarLight
        body: |
          In summer 2001 StarLight, the optical STAR TAP, went into operation. EVL built it with Northwestern's iCAIR and Argonne's Mathematics and Computer Science Division, in partnership with Canada's CANARIE and the Netherlands' SURFnet.

          It moved from 1 and 10 Gigabit Ethernet toward whole wavelengths, helped found the Global Lambda Integrated Facility, and is still running: still in Chicago, still where the international lightpaths land.
        media:
          - src: p2-starlight-building.jpg
            alt: The building at 710 North Lake Shore Drive that houses StarLight
            credit: EVL
        post: /news/2000/2000-10-01-1819/

    interlude:
      kicker: Why a visualization lab built networks
      diagram: triad
      closing: Whichever of the three the lab had not built was the one limiting the science. So it built all three.

  # ---------------------------------------------------------------------------
  - id: part-03
    part: "03"
    years: 2000–2014
    start: 2001
    end: 2014
    title: Pixels at scale
    dek: Optical networks, hundred-megapixel walls, and software that treats pixels as a stream.
    opener:
      src: p3-opener-microscopy-wall.jpg
      alt: A researcher points at a cerebellum microscopy image spread across a tiled display wall
      credit: Lance Long, EVL
    steps:
      - id: geowall-varrier
        year: 2001
        area: vis
        domain: earth
        title: Stereo for classrooms, and without glasses
        body: |
          Two answers to one question: how to put depth in front of more people. GeoWall (2001) built passive stereo from off-the-shelf parts for about $10,000, cheap enough for geoscience classrooms.

          Varrier, first built in September 2001, went the other way: autostereo without glasses, a parallax barrier tuned to the tracked viewer. By 2003–04 it had grown into a 35-panel cylinder.
        media:
          - src: p3-varrier-cylinder.jpg
            alt: The 35-panel cylindrical Varrier display showing terrain
            credit: PRESENCE 33 (2024), CC BY 4.0
          - src: p3-varrier-mars.jpg
            alt: A visitor explores a virtual Mars on Varrier without glasses
            credit: Lance Long, EVL
        post: /news/2001/2001-03-01-1836/

      - id: optiputer
        year: 2002
        label: 2002–2009
        area: hpc
        domain: science
        title: The OptIPuter
        body: |
          Treat the optical network as the backplane of a distributed computer, and bandwidth as the abundant resource. The OptIPuter, a seven-year NSF Information Technology Research project led by Larry Smarr at Calit2, UC San Diego, with EVL as co-lead (DeFanti, Brown and Jason Leigh), was driven by medical imaging and the earth sciences: large images, distributed archives, remote collaborators.

          Its products included the OptIPortal display, LambdaRAM and SAGE.
        diagram: optiputer
        post: /news/2002/2002-09-25-473/

      - id: lambdavision
        year: 2005
        label: 2004–2005
        area: vis
        domain: platforms
        title: LambdaVision
        marks:
          - { year: 2004, title: "Jason Leigh becomes director" }
        body: |
          Lit in July 2005, LambdaVision tiled 55 LCD panels into a wall 17 feet wide: 105 megapixels, driven by a thirty-node cluster and fed over dedicated lightpaths.

          2004 also brought a new director, Jason Leigh, and the end of the original CAVE, dismantled after twelve years.
        stats:
          - { value: "105", label: megapixels }
          - { value: "55", label: LCD panels }
        media:
          - src: p3-lambdavision.jpg
            alt: LambdaVision under construction, a 55-panel wall rising in the lab
            credit: EVL
        post: /news/2005/2005-07-19-631/

      - id: sage
        year: 2004
        area: vis
        domain: platforms
        title: Streaming pixels, not frames
        body: |
          SAGE, the Scalable Adaptive Graphics Environment (2004), decoupled rendering from display. Render nodes, instruments, cameras and laptops stream pixels; SAGE routes them and composites them into windows on any wall, at any resolution, shared by a group.

          That single choice is why a microscope in San Diego, a simulation on a leadership machine and a student's laptop can occupy one surface at once.
        diagram: sage
        media:
          - src: p3-sage-laptop.jpg
            alt: A laptop running SAGE's controls in front of a tiled wall full of windows
            credit: EVL
        post: /news/2004/2004-01-01-1882/

      - id: sage2
        year: 2013
        label: 2004–2018
        area: vis
        domain: platforms
        title: From SAGE to SAGE2
        body: |
          The first SAGE was C++, built for LambdaVision and optical networks. SAGE2 (2013) moved it to the web: nothing to install, any browser can join. That took it from a few rooms to hundreds.

          By 2018 SAGE2 had more than 4,000 users at more than 800 institutions in 18 countries.
        media:
          - src: p3-sage-2004.jpg
            alt: SAGE windows from several sources on a tiled wall, 2004
            credit: EVL
          - src: p3-sage2-2013.jpg
            alt: A presenter points at a SAGE2 wall of images in front of an audience
            credit: EVL
        post: /news/2013/2013-08-16-2042/

      - id: cyber-commons
        year: 2009
        label: 2009–2011
        area: hci
        domain: learning
        title: The wall becomes a classroom
        marks:
          - { year: 2011, title: "The 3D Cyber-Commons" }
        body: |
          Cyber-Commons put a 19-megapixel wall and a 20-gigabit network into an EVL classroom in 2009, and then the largest touch screen built to date. The 3D Cyber-Commons (2011) added passive stereo.

          Students met the technology researchers used, in the room where they took their classes.
        media:
          - src: p3-cyber-commons-3d.jpg
            alt: Two people in stereo glasses reach toward a DNA model on the 3D Cyber-Commons wall
            credit: Lance Long, EVL
        post: /news/2008/2008-01-01-1510/

      - id: cave2
        year: 2012
        area: hci
        domain: platforms
        title: "CAVE2: hybrid reality"
        marks:
          - { year: 2013, title: "CAVE2 licensed to Mechdyne" }
        body: |
          Twenty years after the CAVE, EVL rebuilt the room out of LCD panels. CAVE2 (October 2012) is a 320-degree ring of 72 passive-stereo panels, 18 columns by 4 rows, driven by a 36-node cluster, with camera-based tracking and light glasses.

          Hybrid means the room reconfigures for the same group, immersive in the morning and analytical in the afternoon, rather than forcing a choice in advance. Mechdyne licensed it in 2013.
        specs:
          - { label: Geometry, value: "320-degree ring, 18 columns × 4 rows" }
          - { label: Panels, value: "72 passive-stereo LCDs" }
          - { label: Resolution, value: "37 Mpixel in 3D, 74 Mpixel in 2D" }
          - { label: Compute, value: "36-node cluster" }
        media:
          - src: p3-cave2-rendering.jpg
            alt: Rendering of CAVE2's 320-degree ring of panels
            credit: Jonas Talandis, EVL
          - src: p3-cave2-enterprise.jpg
            alt: A visitor inside a model of the Starship Enterprise's bridge in CAVE2
            credit: Lance Long and Arthur Nishimoto, EVL
        post: /news/2012/2012-10-03-1078/

  # ---------------------------------------------------------------------------
  - id: part-04
    part: "04"
    years: 2014–2026
    start: 2014
    end: now
    title: One lab, many domains
    dek: New rooms, new instruments and a new generation, and the lab's subjects multiply.
    opener:
      src: p4-opener-cave2-molecules.jpg
      alt: Visitors in CAVE2 surrounded by large molecular models
      credit: Lance Long, EVL
    steps:
      - id: instrument-shelf
        timeline: false
        title: The instrument shelf
        body: |
          The question is no longer which display wins. **CAVE2** is still here and still used, now one option among several. **Continuum** pairs a touch wall with a stereo wall. **SAGE walls** are the everyday surface, in meeting rooms and offices. **Headsets** give a private view beside the public wall.

          The job is choosing the right one for the task, and moving one analysis across all four without losing its place.
        media:
          - src: p4-shelf-cave2.jpg
            alt: A researcher in front of a molecular simulation on CAVE2
            credit: EVL
          - src: p4-shelf-continuum.jpg
            alt: A presenter at Continuum's walls with a seated audience
            credit: EVL
          - src: p4-shelf-sage-wall.jpg
            alt: A group discussing charts on a SAGE wall
            credit: EVL
          - src: p4-shelf-headset.jpg
            alt: A student in a VR headset with a controller
            credit: EVL

      - id: sensei
        year: 2014
        label: 2014–2019
        area: vis
        domain: earth
        title: SENSEI
        marks:
          - { year: 2015, title: "A forest in Panama, explored in CAVE2" }
        body: |
          SENSEI, an NSF instrument led by Maxine Brown, built ultra-high-resolution 3D panoramic cameras to bring distant places into the room: Egyptian temples, and a forest in Panama where researchers tracked animal movement and then explored it in CAVE2.
        media:
          - src: p4-sensei-panama.jpg
            alt: Researchers in CAVE2 point at a panoramic forest scene from Panama
            credit: Lance Long, EVL
        post: /news/2014/2014-09-16-1179/

      - id: vis-2015
        year: 2015
        area: vis
        domain: science
        title: IEEE VIS comes to Chicago
        body: |
          In October 2015 IEEE VIS, the visualization field's largest annual meeting, came to downtown Chicago, and EVL helped run it. Maxine Brown, by then EVL's director, was general co-chair with Michael E. Papka of Argonne, an EVL alumnus who would become the lab's director in 2024. G. Elisabeta Marai co-chaired the Doctoral Colloquium, and Angus Forbes and Daria Tsoupikova co-chaired the Arts Program with Inria's Fanny Chevalier. The Arts Program, with Dan Sandin as an invited artist, held a two-week exhibition at the School of the Art Institute of Chicago, open to the public.

          Forbes's student Kyle Almryde won an honorable mention in the SciVis contest for this view of dark-matter halos. Twenty-eight years after the ViSC report, the field it helped start met in the lab's own city.
        media:
          - src: p4-vis2015-dark-sky.jpg
            alt: Dark-matter halo merger trees drawn as glowing branches of colored points on black
            credit: Kyle R. Almryde and Angus G. Forbes, EVL
        post: /news/2015/2015-10-25-2141/

      - id: continuum
        year: 2016
        label: 2016–2019
        area: hci
        domain: learning
        title: Continuum
        body: |
          In 2016 an NSF instrumentation award turned Cyber-Commons into Continuum, a room that senses and supports the group working in it. Since 2019 it has paired a 24-foot, 37-megapixel touch wall with a 16-foot, 17-megapixel stereo wall, with ceiling microphones, cameras, lighting control and room-wide tracking.

          It is a lab, a classroom and a meeting room, often on the same day.
        media:
          - src: p4-continuum-class.jpg
            alt: A full class working in Continuum, the walls lit with SAGE windows
            credit: PRESENCE 33 (2024), CC BY 4.0
        post: /news/2016/2016-10-01-2316/

      - id: compaas
        year: 2018
        label: 2018–2022
        area: hpc
        domain: platforms
        title: Pools, not machines
        body: |
          COMPaaS DLV (NSF, 2018) treated CPUs, GPUs and storage as pools allocated on demand over a PCI Express fabric rather than as fixed machines, with Kubernetes, containerized GPU workloads and a public JupyterHub.

          Researchers could add their own accelerators to the pool. More than forty faculty, students and collaborators used it.
        diagram: compaas
        post: /news/2018/2018-10-01-2401/

      - id: sage3
        year: 2020
        label: 2020–2026
        area: vis
        domain: platforms
        title: SAGE3
        marks:
          - { year: 2025, title: "SAGE named a top-ten UIC innovation" }
          - { year: 2026, title: "SAGE's first 22 years" }
        body: |
          SAGE3, an NSF collaboration of UIC, the University of Hawaiʻi and Virginia Tech, re-architected the software for hybrid work: one shared canvas for a group, whether they stand at the wall or work from home. Notebooks, AI services and live visualizations are objects on the canvas, not separate applications, and a session can be saved and resumed the next day, or the next year.

          An alpha arrived in 2021, a release at SC22 and AI-enhanced versions in 2025. That year UIC named SAGE one of its top ten innovations, and in 2026 the team told the story of its first 22 years.
        media:
          - src: p4-sage3-wall.jpg
            alt: Two researchers at a SAGE3 wall full of papers, notebooks and charts
            credit: EVL
        post: /news/2025/2025-04-25-2903/
        links:
          - { text: SAGE3, url: /projects/sage3-renambot/ }

      - id: new-generation
        timeline: false
        title: A new generation
        marks:
