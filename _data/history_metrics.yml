# Research-shape numbers behind Part 06 ("What EVL enables") of /history/.
# Only aggregates live here: no row describes a single person.
#
# Career publication records of today's 19 faculty and affiliated faculty (DBLP, ACM DL,
# Google Scholar), approximate and rounded to the nearest five; a record that spans two
# areas splits evenly. Software figures come from the Impact page at build time.

publications:
  people: 19
  records: 1465
  # Weighted career records per area.
  mix: { hpc: 373, vis: 447.5, hci: 644.5 }
  # Venn regions: an area counts when it reaches a fifth of a person's record.
  regions: { hpc: 1, vis: 1, hci: 3, hpc_vis: 1, vis_hci: 9, hpc_hci: 0, all: 4 }
  clusters:
    - { id: exascale, label: "Exascale systems", area: hpc, size: 5 }
    - { id: scivis, label: "Scientific & in-situ visualization", area: vis, size: 6 }
    - { id: va, label: "Visual analytics & perception", area: vis, size: 3 }
    - { id: immersive, label: "Immersive & collaborative environments", area: hci, size: 6 }
    - { id: creativity, label: "Creativity, learning & social computing", area: hci, size: 7 }
  # Members shared by two clusters (counts only).
  cluster_links:
    - { a: exascale, b: immersive, shared: 2 }
    - { a: exascale, b: scivis, shared: 1 }
    - { a: scivis, b: immersive, shared: 3 }
    - { a: scivis, b: va, shared: 2 }
    - { a: immersive, b: creativity, shared: 1 }
  bridging: 7
